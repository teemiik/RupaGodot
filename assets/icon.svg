<?xml version="1.0" encoding="UTF-8"?>
<!--
  Иконка приложения «Rupa» — вариант A1 (мягкий тёплый градиент).
  Мастер-источник дизайна. Палитра из scripts/game.gd.
  Поле 200x200; PNG-артефакты собирает tools/generate_icon.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CCC2AD"/>
      <stop offset="1" stop-color="#85212E"/>
    </linearGradient>
    <radialGradient id="hole" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0.5" stop-color="#0C0C0E"/>
      <stop offset="1" stop-color="#221318"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.34" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#CCCCD4"/>
      <stop offset="1" stop-color="#8F8F97"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- плитка -->
  <rect x="6" y="6" width="188" height="188" rx="44" fill="url(#bg)"/>

  <!-- кайма-рулайт вокруг отверстия -->
  <ellipse cx="100" cy="108" rx="48" ry="48" fill="none" stroke="#F5E6C7" stroke-width="2.5" opacity="0.5"/>

  <!-- отверстие -->
  <circle cx="100" cy="108" r="46" fill="url(#hole)"/>
  <ellipse cx="100" cy="98" rx="44" ry="15" fill="#000000" opacity="0.45"/>

  <!-- шар на краю -->
  <ellipse cx="132" cy="94" rx="17" ry="6" fill="#000000" opacity="0.28" filter="url(#soft)"/>
  <circle cx="132" cy="75" r="16" fill="url(#ball)"/>
</svg>
